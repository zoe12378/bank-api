spring.application.name=bank-api
server.port=${PORT:8080}
spring.datasource.url=jdbc:mysql://localhost:3306/bank_demo?serverTimezone=Asia/Taipei&characterEncoding=utf8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# 由既有的 MySQL schema 管理資料表；程式啟動時只驗證對應關係，不自行修改資料表。
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT 簽章密鑰只由執行環境提供，絕不寫入 Git。請使用至少 32 字元的隨機值。
jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=30
jwt.refresh-expiration-days=7

# 正式部署時以 CORS_ALLOWED_ORIGINS 設成 Vercel 網址，不要使用萬用字元 *。
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081}
